<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        :root {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 32px; /* tamaño base de la unidad rem */
        }

        body {
            background-color: bisque;
            /* border: solid 5px red; */
            margin: 0;
            padding: 0;
            min-height: 100dvh;
        }

        /* anchor */
        a {
            text-decoration: none;
            color: darkgreen;
        }

        a:visited {
            color: lightgreen;
        }

        a:hover {
            color: chartreuse;
            font-weight: bold;
            background-color: gold;
        }

        a:focus {
            text-decoration: underline;
            outline: none;
        }


    </style>
</head>

        </li>
        <li>

        </li>
        <li> 
            <a href="https://www.cloudfare.com"> Cloudfare </a> 
        </li>
        <li>

        </li>
