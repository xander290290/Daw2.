<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botones de radio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Bocadillo</h1>
    <form action=""">
        <input type="radio" name="Bocadillo" id="1" value="Chorizo">
        <label for="1">Chorizo</label>
        <br>

        <input type="radio" name="Bocadillo" id="2" value="Queso">
        <label for="2">Queso</label>
        <br>

        <input type="radio" name="Bocadillo" id="3" value="Atun">
        <label for="3">Atun</label>
        <br>

        <input type="radio" name="Bocadillo" id="4" value="Mortadela">
        <label for="4">Mortadela</label>
    </form>
</body>
</html>
