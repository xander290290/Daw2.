<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script type="module">
        import { pokemons } from './pokemons.js';

        const nSelect = document.getElementById('eSelPokemons');

        for (const pokemon of pokemons) {
            const nOption = document.createElement('option');
            nSelect.appendChild(nOption);
            nOption.setAttribute('value', pokemon.url.split('/')[6]);
    
            const nText = document.createTextNode(pokemon.name);
            nOption.appendChild(nText);
        }

    </script>
</head>
<body>
    <h1>Pokemons</h1>

    <select id="eSelPokemons">
        <option selected disabled>Elige un pokemon</option>
        <!-- 
        <option value="1">Pikachu</option>
        <option value="2">Bulbasur</option> 
        -->
    </select>
</body>
</html>
