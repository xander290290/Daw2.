<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        table, tr, th, td {
            border: solid;
            border-collapse: collapse;
        }

        tbody tr:nth-child(2n) {
            background-color: aqua;
        }

        tbody tr:nth-child(2n+1) {
            background-color: gold;
        }
    </style>

    <script type="module">
        import { empleados } from './empleados.js';

        const nTbody = document.getElementById('eTbdEmpleados');

        for (let i in empleados) {
            const nTr = document.createElement('tr');
            nTbody.appendChild(nTr);
            nTr.setAttribute('data-empleado', parseInt(i));
    
            const nTdNumero = document.createElement('td');
            nTr.appendChild(nTdNumero);
    
            const nTxtNumero = document.createTextNode(parseInt(i)+1);
            nTdNumero.appendChild(nTxtNumero);
    
            const nTdNombre = document.createElement('td');
            nTr.appendChild(nTdNombre);
    
            const nTxtNombre = document.createTextNode(`${empleados[i].nombre} ${empleados[i].apellido}`);
            nTdNombre.appendChild(nTxtNombre);
    
            const nTdCategoria = document.createElement('td');
            nTr.appendChild(nTdCategoria);
    
            const nTxtCategoria = document.createTextNode(empleados[i].categoria);
            nTdCategoria.appendChild(nTxtCategoria);
        }


    </script>
</head>
<body>
    <h1>Tabla con empleados</h1>

    <table>
        <thead>
            <tr>
                <th>Número</th>
                <th>Nombre</th>
                <th>Categoría</th>
            </tr>
        </thead>

        <tbody id="eTbdEmpleados">
            <!-- <tr>
                <td>1</td>
                <td>Serena Mcmillan</td>
                <td>informatico</td>
            </tr> -->
        </tbody>

        <tfoot>
            <tr>
                <th>Número</th>
                <th>Nombre</th>
                <th>Categoría</th>
            </tr>
        </tfoot>
    </table>
    
</body>
</html>
