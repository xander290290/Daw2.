<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>UT1 - Lenguaje JavaScript Básico</title>
        <style>
            h1 {
                color:blue;
            }
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 20%;
                background-color:bisque;
            }

            main {
                width: 100%;
                min-height: 80dvh;
            }

        </style>
        <script>
            console.log("JavaScript o EcmaScript");
            console.log("La última versión de JavaScript es ES2026");
            console.log("JavaScript moderno empezó con ES6 (2015)");
            console.log("El JavaScript anterior es ES5 (2009). Ya no hacía falta emplear librerías como JQuery");
        </script>
	</head>
	<body>
		<header>
			<h1>Lenguaje JavaScript Básico</h1>
            <script>
                "use strict";
                let variable = 1;
                console.log(variable, typeof(variable));

                let variable2 = "uno";
                console.log(variable2, typeof(variable2));

                let variable3 = 'uno';
                console.log(variable3, typeof(variable3));

                let variable4 = undefined;
                console.log(variable4, typeof(variable4));

                let variable5 = {nombre: 'adolfo', apellido: 'martinez'};
                console.log(variable5, typeof(variable5));

                let variable6 = [1, 2, 3];
                console.log(variable6, typeof(variable6));

                function saludo() {
                    console.log("Hola, mundo!");
                }
                console.log(saludo, typeof(saludo));
            </script>
		</header>

		<main>
			<h2>Tipos de datos en EcmaScript</h2>
            <p>JavaScript es un lenguaje de tipado dinámico</p>
		</main>

		<footer>
			<small>UT1 - Lenguaje JavaScript Básico</small>
		</footer>
	</body>
</html>
